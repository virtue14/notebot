[project]
name = "notebot-backend"
version = "1.1.0"
description = "Notebot Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.45.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "faster-whisper>=1.1.0",
    "openai>=2.34.0",
    "anthropic>=0.95.0",
    "google-genai>=1.75.0",
    "pypdf>=6.13.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
